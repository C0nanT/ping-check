services:
  monitor:
    build: .
    image: ping-check
    container_name: ping-check
    restart: unless-stopped
    # rede do host: precisa ver a rota padrão, o gateway e /proc/net/wireless reais
    network_mode: host
    # roda como root só para o systemd-inhibit; o monitor cai para 1000:1000 (ver Dockerfile)
    # tini como PID 1: repassa o SIGTERM ao monitor
    init: true
    environment:
      # minutos entre testes de velocidade (~35 MB cada); 0 desliga
      VELOCIDADE_A_CADA: ${VELOCIDADE_A_CADA:-30}
      # horas locais do teste completo (download de ~10 s com 4 conexões, ~1 GB cada a 600 Mbps); vazio desliga
      VELOCIDADE_COMPLETO_HORAS: ${VELOCIDADE_COMPLETO_HORAS-9,15,21}
    # AppArmor do Docker bloqueia o D-Bus do host, usado pelo nmcli
    security_opt:
      - apparmor=unconfined
    volumes:
      # projeto montado em /app: conexao.db fica no host (make summary/web continuam funcionando)
      - .:/app
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /etc/localtime:/etc/localtime:ro
    # saudável = última amostra em checks tem menos de 30 s (ciclo é de 5 s)
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import sqlite3,sys,time; e=sqlite3.connect('file:/app/conexao.db?mode=ro',uri=True,timeout=5).execute('select max(epoch) from checks').fetchone()[0]; sys.exit(0 if e and time.time()-e<30 else 1)"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  painel:
    # fora do `docker compose up -d`: só sobe com --profile painel (o dia a dia é `make web`)
    profiles: ["painel"]
    # mesma imagem do monitor (construída pelo serviço acima); sem build próprio
    image: ping-check
    pull_policy: never
    container_name: ping-check-painel
    restart: unless-stopped
    # bind em 127.0.0.1 do host: acessível só desta máquina, sem publicar porta na rede
    network_mode: host
    # só leitura no banco (mode=ro); sem root, sem systemd-inhibit, sem D-Bus
    user: "1000:1000"
    init: true
    command: ["python3", "-u", "painel.py"]
    environment:
      PORT: ${PORT:-8080}
    volumes:
      # leitura e escrita: um leitor SQLite em WAL precisa do -shm
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api?min=1' % os.environ.get('PORT','8080'), timeout=5).read()"
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
